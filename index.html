  --color-text-on-navy:var(--_g0);

  --color-danger-bg:#FEF2F2; --color-danger-fg:#C0392B; --color-danger-bd:var(--_coral);
  --color-info-bg:var(--_n50); --color-info-fg:var(--_n700); --color-info-bd:var(--_n500);
  --color-neutral-bg:var(--_g100); --color-neutral-fg:var(--_g600); --color-neutral-bd:var(--_g400);

  --shadow-lg:0 10px 30px rgba(0,0,0,0.10); --shadow-brand:0 4px 16px rgba(245,196,0,0.20);

  --color-neutral-bg:rgba(255,255,255,0.05); --color-neutral-fg:var(--_g400); --color-neutral-bd:rgba(255,255,255,0.10);
  --shadow-sm:0 1px 3px rgba(0,0,0,0.40); --shadow-md:0 4px 12px rgba(0,0,0,0.40);
  --shadow-lg:0 10px 30px rgba(0,0,0,0.50); --shadow-brand:0 4px 20px rgba(245,196,0,0.15);
}
.theme-brand {
  color-scheme:light;
  --color-surface-page:var(--_y400); --color-surface-base:var(--_y200);
  --color-surface-elevated:var(--_y50); --color-surface-sunken:var(--_y600);

  --color-info-bg:rgba(26,61,110,0.10); --color-info-fg:var(--_n900); --color-info-bd:var(--_n700);
  --color-neutral-bg:rgba(0,0,0,0.06); --color-neutral-fg:var(--_y900); --color-neutral-bd:rgba(0,0,0,0.15);
  --shadow-sm:0 1px 3px rgba(0,0,0,0.12); --shadow-md:0 4px 12px rgba(0,0,0,0.14);
  --shadow-lg:0 10px 30px rgba(0,0,0,0.18); --shadow-brand:0 4px 16px rgba(0,0,0,0.15);
}
.theme-navy {
  color-scheme:dark;
  --color-surface-page:var(--_n950); --color-surface-base:var(--_n900);
  --color-surface-elevated:var(--_n700); --color-surface-sunken:var(--_n950);

  --color-text-on-navy:var(--_g0);

  --color-border-strong:rgba(107,158,208,0.35); --color-border-brand:var(--_y400);
  --color-success-bg:rgba(45,140,122,0.15); --color-success-fg:var(--_teal-light); --color-success-bd:rgba(45,140,122,0.35);
  --color-warning-bg:rgba(245,196,0,0.12); --color-warning-fg:var(--_y200); --color-warning-bd:rgba(245,196,0,0.30);

  --color-info-bg:rgba(45,107,168,0.20); --color-info-fg:var(--_n100); --color-info-bd:rgba(107,158,208,0.35);

  --shadow-lg:0 10px 30px rgba(0,0,0,0.60); --shadow-brand:0 4px 20px rgba(245,196,0,0.18);

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--color-surface-page);
  color: var(--color-text-primary);
  font-family: var(--font-body);
  min-height: 100vh;
}

/* Theme bar — lives in header-right */
.theme-bar {
  display: flex; gap: 4px;
  padding: 8px 16px;
  background: var(--color-surface-secondary);
}
.theme-bar button {
  background: transparent;
  color: var(--color-text-on-navy);
  border: 1px solid rgba(255,255,255,0.2);
  padding: 4px 10px;
  border-radius: var(--r-sm);
  font-family: var(--font-display); font-weight: 700; font-size: 11px;
  letter-spacing: 0.06em; text-transform: uppercase;
  cursor: pointer;
}
.theme-bar button.active { background: var(--color-brand-primary); color: var(--color-text-on-brand); border-color: var(--color-brand-primary); }

.app-header {
  position: sticky; top: 0; z-index: 10;
  background: var(--color-surface-base);
  border-bottom: 1px solid var(--color-border-default);
  padding: 12px 20px;
  display: flex; justify-content: space-between; align-items: center;
  gap: 16px;
}
.header-left { display: flex; align-items: center; gap: 14px; }
.logo-wrap {
  width: 40px; height: 40px;
  border-radius: 50%; overflow: hidden;
  flex-shrink: 0;
}
.logo-wrap img { display: block; width: 100%; height: 100%; object-fit: cover; }
.header-text .greet {
  font-family: var(--font-display); font-weight: 800;
  font-size: 18px; line-height: 1.1;
  color: var(--color-text-primary);
  text-transform: uppercase; letter-spacing: 0.03em;
}
.header-text .day-date {
  font-family: var(--font-body); font-weight: 500;
  font-size: 12px; color: var(--color-text-secondary);
  margin-top: 2px;
}
.header-right { display: flex; align-items: center; gap: 10px; }
.refresh-btn {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--color-surface-elevated);
  color: var(--color-text-primary);
  border: 1px solid var(--color-border-default);
  border-radius: var(--r-md);
  padding: 6px 12px;
  font-family: var(--font-body); font-weight: 500; font-size: 12px;
  cursor: pointer;
}
.refresh-btn:hover { border-color: var(--color-border-brand); }
.refresh-btn.spinning .refresh-icon { animation: spin 0.6s linear infinite; }
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
.refresh-icon { display: inline-block; font-size: 14px; }
.freshness-bar {
  background: var(--color-surface-sunken);
  border-bottom: 1px solid var(--color-border-subtle);
  padding: 6px 20px;
  font-size: 11px; color: var(--color-text-secondary);
  letter-spacing: 0.04em;
}
.freshness-bar.error {
  background: var(--color-warning-bg);
  color: var(--color-warning-fg);
  border-bottom-color: var(--color-warning-bd);
}

@media (max-width: 560px) {
  .header-text .day-date { display: none; }
  .refresh-label { display: none; }
  .theme-bar button { padding: 4px 6px; font-size: 10px; }
}
.app-body {
  display: grid;
  grid-template-columns: 220px 1fr;
  min-height: calc(100vh - 110px);
}
.sidebar {
  background: var(--color-surface-base);
  border-right: 1px solid var(--color-border-default);
  padding: 16px 12px;
}
.sidebar nav { display: flex; flex-direction: column; gap: 4px; }
.nav-item {
  display: flex; align-items: center; gap: 12px;
  background: transparent;
  color: var(--color-text-secondary);
  border: none;
  border-radius: var(--r-md);
  padding: 10px 14px;
  font-family: var(--font-display); font-weight: 700; font-size: 13px;
  letter-spacing: 0.04em; text-transform: uppercase;
  cursor: pointer;
  text-align: left;
}
.nav-item:hover { background: var(--color-surface-overlay); color: var(--color-text-primary); }
.nav-item.active {
  background: var(--color-brand-primary);
  color: var(--color-text-on-brand);
}
.nav-icon { font-size: 14px; opacity: 0.85; width: 16px; text-align: center; }
.main {
  padding: 24px;
  overflow-x: hidden;
}
.section-pane { display: none; }
.section-pane.active { display: block; }
.section-title {
  font-family: var(--font-display); font-weight: 900;
  font-size: 32px; line-height: 1.1;
  color: var(--color-text-primary);
  text-transform: uppercase; letter-spacing: 0.02em;
  margin: 0 0 16px;
}
.section-placeholder {
  color: var(--color-text-tertiary);
  font-style: italic;
  font-size: 14px;
}
.kpi-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 24px;
}
.kpi-card {
  background: var(--color-surface-elevated);
  border: 1px solid var(--color-border-default);
  border-radius: var(--r-lg);
  padding: 16px;
}
.kpi-label {
  font-family: var(--font-body); font-weight: 500;
  font-size: 11px; color: var(--color-text-secondary);
  text-transform: uppercase; letter-spacing: 0.08em;
}
.kpi-number {
  font-family: var(--font-display); font-weight: 900;
  font-size: 36px; line-height: 1.05;
  color: var(--color-text-primary);
  margin-top: 6px;
}
.kpi-card.success .kpi-number { color: var(--color-success-fg); }
.kpi-card.warning .kpi-number { color: var(--color-warning-fg); }
.kpi-card.danger .kpi-number { color: var(--color-danger-fg); }
.kpi-empty .kpi-number { color: var(--color-text-tertiary); }

@media (max-width: 560px) {
  .kpi-row { grid-template-columns: repeat(2, 1fr); }
  .kpi-number { font-size: 28px; }
}

.today-issues {
  background: var(--color-danger-bg);
  border: 1px solid var(--color-danger-bd);
  border-radius: var(--r-lg);
  padding: 16px;
  margin-bottom: 24px;
}
.today-issues h2 {
  font-family: var(--font-display); font-weight: 800;
  font-size: 16px; color: var(--color-danger-fg);
  text-transform: uppercase; letter-spacing: 0.04em;
  margin: 0 0 10px;
}
.today-issues ul { list-style: none; padding: 0; margin: 0; }
.today-issues li {
  display: flex; justify-content: space-between; align-items: center;
  padding: 8px 0;
  border-top: 1px solid var(--color-danger-bd);
  font-family: var(--font-body); font-size: 13px;
  color: var(--color-text-primary);
  cursor: pointer;
}
.today-issues li:first-child { border-top: none; }
.today-issues .issue-meta { font-size: 11px; color: var(--color-text-secondary); }

.today-insights {
  background: var(--color-surface-elevated);
  border: 1px solid var(--color-border-default);
  border-radius: var(--r-lg);
  padding: 16px;
}
.today-insights h2 {
  font-family: var(--font-display); font-weight: 800;
  font-size: 16px; color: var(--color-text-primary);
  text-transform: uppercase; letter-spacing: 0.04em;
  margin: 0 0 12px;
}
.today-insights .insight {
  border-top: 1px solid var(--color-border-subtle);
  padding: 10px 0;
}
.today-insights .insight:first-of-type { border-top: none; }
.today-insights .insight-title {
  font-family: var(--font-body); font-weight: 600; font-size: 13px;
  color: var(--color-text-primary);
}
.today-insights .insight-body {
  font-family: var(--font-body); font-size: 13px;
  color: var(--color-text-secondary);
  margin-top: 4px;
}
.today-insights .insight-meta {
  font-size: 11px; color: var(--color-text-tertiary);
  margin-top: 4px;
}
.today-insights .insights-empty {
  font-size: 13px; color: var(--color-text-tertiary);
  font-style: italic;
}

.bottom-nav { display: none; }
.more-drawer { display: none; }

@media (max-width: 767px) {
  .app-body {
    grid-template-columns: 1fr;
    padding-bottom: calc(56px + env(safe-area-inset-bottom));
  }
  .sidebar { display: none; }
  .main { padding: 16px; }
  .section-title { font-size: 26px; }

  .bottom-nav {
    display: flex;
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
    background: var(--color-surface-base);
    border-top: 1px solid var(--color-border-default);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .bottom-nav-item {
    flex: 1;
    background: transparent;
    color: var(--color-text-secondary);
    border: none;
    padding: 10px 4px;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    font-family: var(--font-body); font-weight: 500; font-size: 10px;
    cursor: pointer;
    min-height: 56px;
    position: relative;
  }
  .bottom-nav-item.active { color: var(--color-brand-primary); }
  .bottom-nav-item.active::after {
    content: '';
    position: absolute; top: 0; left: 25%; right: 25%; height: 2px;
    background: var(--color-brand-primary);
  }
  .bn-icon { font-size: 18px; }
  .bn-label { letter-spacing: 0.03em; }

  .more-drawer.open {
    display: flex; align-items: flex-end;
    position: fixed; inset: 0; z-index: 30;
    background: rgba(0,0,0,0.45);
  }
  .more-sheet {
    background: var(--color-surface-base);
    border-top-left-radius: var(--r-xl);
    border-top-right-radius: var(--r-xl);
    padding: 20px 16px calc(20px + env(safe-area-inset-bottom));
    width: 100%;
    display: flex; flex-direction: column; gap: 8px;
  }
  .more-sheet h3 {
    font-family: var(--font-display); font-weight: 800; font-size: 18px;
    color: var(--color-text-primary);
    text-transform: uppercase; letter-spacing: 0.04em;
    margin: 0 0 8px;
  }
  .more-item {
    display: flex; align-items: center; gap: 12px;
    background: var(--color-surface-elevated);
    color: var(--color-text-primary);
    border: 1px solid var(--color-border-default);
    border-radius: var(--r-md);
    padding: 14px;
    font-family: var(--font-display); font-weight: 700; font-size: 14px;
    text-transform: uppercase; letter-spacing: 0.04em;
    cursor: pointer;
    text-align: left;
  }
}

/* ── SCHEDULE: CHIPS ──────────────────────────────────────────── */
.chip-row {
  display: flex; flex-wrap: wrap; gap: 6px;
  margin-bottom: 16px;
}
.chip {
  background: var(--color-surface-elevated);
  color: var(--color-text-secondary);
  border: 1px solid var(--color-border-default);
  border-radius: var(--r-pill);
  padding: 6px 12px;
  font-family: var(--font-display); font-weight: 700; font-size: 11px;
  text-transform: uppercase; letter-spacing: 0.04em;
  cursor: pointer;
}
.chip.active {
  background: var(--color-brand-primary);
  color: var(--color-text-on-brand);
  border-color: var(--color-brand-primary);
}

/* ── SCHEDULE: AGENT GROUPS ───────────────────────────────────── */
.agent-group {
  background: var(--color-surface-elevated);
  border: 1px solid var(--color-border-default);
  border-radius: var(--r-lg);
  margin-bottom: 12px;
  overflow: hidden;
}
.agent-group-header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px 16px;
  cursor: pointer;
  background: var(--color-surface-sunken);
}
.agent-group-header h3 {
  font-family: var(--font-display); font-weight: 800; font-size: 14px;
  color: var(--color-text-primary);
  text-transform: uppercase; letter-spacing: 0.04em;
  margin: 0;
}
.agent-group-summary {
  font-size: 11px; color: var(--color-text-secondary);
}
.agent-tasks { display: none; }
.agent-group.open .agent-tasks { display: block; }
.agent-group.open .agent-group-caret { transform: rotate(90deg); }
.agent-group-caret { display: inline-block; transition: transform 0.15s ease; margin-right: 8px; }

/* ── SCHEDULE: TASK ROWS ──────────────────────────────────────── */
.task-row {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 16px;
  border-top: 1px solid var(--color-border-subtle);
  cursor: pointer;
}
.task-row:hover { background: var(--color-surface-overlay); }
.task-name {
  flex: 1;
  font-family: var(--font-body); font-weight: 500; font-size: 13px;
  color: var(--color-text-primary);
}
.task-meta {

    tags: ["pulse", "scorecard", "cycle", "adherence", "cso", "zoho"],

    body: `
      <h3>Step 1 — Defining a "cycle account"</h3>
      <p>Not every account has a real, repeating call cycle. Some are visited once and never again. Some are visited erratically. We need a rule for which accounts count as "regularly visited."</p>
      <h4>The rule applied</h4>
      <p>An account qualifies as a cycle account if:</p>
      <ol>
        <li>It has <strong>≥3 check-ins</strong> in the data window</li>
        <li>The <strong>average gap between consecutive visits is ≤35 days</strong></li>
      </ol>
      <h4>Why those numbers</h4>
      <ul>
        <li><strong>3 visits minimum</strong> — with only 2 visits, you can't tell if a gap is meaningful or coincidence. 3 gives you at least 2 inter-visit gaps to average.</li>
        <li><strong>35-day cap</strong> — roughly 5 weeks. Anything slower doesn't feel like a "cycle"; it feels like occasional contact. The gap distribution had a natural break here: P75 was 38 days, P90 was 53 days. Below 35d the visits look intentional; above 35d they look opportunistic.</li>
      </ul>
      <p>This produced <strong>201 cycle accounts</strong> out of 432 ever visited.</p>
      <h4>Things to question</h4>
      <ul>
        <li>Should the threshold be 28 days (truly monthly) instead of 35? That would drop the count from 201 to 176.</li>
        <li>Should it be ≥4 visits instead of ≥3? Stricter, but you lose accounts on a genuine 6-week cycle.</li>
        <li>Should the rule be per-rep instead of global? BM has accounts on 4–7 day cycles that look like multiple buyer contacts at one location, not weekly stores.</li>
      </ul>

      <h3>Step 2 — Computing each account's expected cycle</h3>
      <p>For each cycle account, compute its <strong>own historical average gap</strong> between visits:</p>
      <pre><code>gaps = [(visit_2 - visit_1).days, (visit_3 - visit_2).days, ...]
avg_gap = mean(gaps)</code></pre>
      <p>Example: Patel Hardware visited Jan 5, Jan 30, Feb 25, Mar 22 → gaps 25, 26, 25 → average 25.3 days.</p>
      <h4>Why historical average per account</h4>
      <p>The alternative was a uniform target — e.g. "every account every 28 days." That ignores reality. Some accounts buy weekly and need fortnightly visits; others are happy with a monthly catch-up. Using each account's historical pattern as its own benchmark means the metric self-calibrates.</p>
      <h4>Things to question</h4>
      <ul>
        <li>The historical average might bake in <strong>bad behaviour</strong>. If a rep has been under-visiting an account, the "expected cycle" becomes the under-visited rate. A truly strategic answer would set targets based on revenue/strategic importance, not historical visit frequency.</li>
        <li>The mean is sensitive to outliers. A median would be more robust.</li>
      </ul>

      <h3>Step 3 — Adherence status (per account)</h3>
      <pre><code>ratio = days_since_last_visit / avg_gap

ratio ≤ 1.0  → "On Track"
ratio ≤ 1.4  → "Due"
ratio ≤ 2.0  → "Overdue"
ratio > 2.0  → "Critical"</code></pre>
      <h4>Why a ratio approach</h4>
      <p>A 25-day cycle account that hasn't been seen in 30 days (ratio 1.2) is mildly overdue. A 7-day cycle account that hasn't been seen in 30 days (ratio 4.3) is critically overdue. Same absolute days mean very different things — the ratio scales urgency to the relationship.</p>
      <h4>Why those thresholds</h4>
      <ul>
        <li><strong>1.0 → 1.4</strong>: a 40% buffer feels like normal slippage (sick day, weather, traffic). Not yet a problem.</li>
        <li><strong>1.4 → 2.0</strong>: now the normal window has been missed. Real gap.</li>
        <li><strong>&gt; 2.0</strong>: twice as long as normal. Relationship at risk.</li>
      </ul>
      <h4>Things to question</h4>
      <ul>
        <li>The 1.4 / 2.0 thresholds are educated guesses. Could be 1.2 / 1.8 or 1.5 / 2.5 — no industry standard.</li>
        <li>A weekly cycle account at ratio 2.0 (14 days late) is worse than a monthly account at ratio 2.0 (60 days late). The ratio treats them the same.</li>
      </ul>

      <h3>Step 4 — Daily cycle target (PULSE activity log)</h3>
      <p>This is where the biggest interpretive leap happens.</p>
      <pre><code>daily_target = round(sum(1 / avg_gap for each cycle account))</code></pre>
      <h4>The logic</h4>
      <p>Each account "consumes" <code>1/avg_gap</code> of a visit per day. A 25-day cycle account consumes 0.04 visits/day. Sum across all the rep's cycle accounts gives the daily visit rate needed to maintain the whole portfolio.</p>
      <h4>Worked example for AC</h4>
      <ul>
        <li>52 cycle accounts, avg gap ~26 days</li>
        <li>Each contributes ~1/26 = 0.038 visits/day</li>
        <li>Total: 52 × 0.038 ≈ <strong>2 visits/day</strong></li>
      </ul>
      <p>This is the "small number" on each heat map tile. The "big number" is the cycle account visits the rep actually logged that day.</p>
      <h4>Things to question — the most important caveats</h4>
      <ol>
        <li><strong>The target is a rate, not a plan.</strong> It says "you need 2 cycle visits/day on average," not "visit account X today." A rep could visit the same 2 accounts every day and tick the box without rotating their portfolio.</li>
        <li><strong>The target ignores working day variability.</strong> Holidays, sick days, training — none of that is built in.</li>
        <li><strong>Only cycle accounts count as "actual."</strong> A rep doing legitimate prospecting/walk-ins gets a "0" on the tile even when busy. Deliberate — the heat map is now measuring cycle hygiene specifically — but worth knowing.</li>
        <li><strong>The "Related To" field is the join key.</strong> If a rep checks in at "Patel Hardware" but the cycle account is "Patel (Nkomazi Imp. & Exp. CC)", they don't match. AP's 0% adherence may be a name-matching issue rather than behaviour.</li>
        <li><strong>Two-week measurement window.</strong> Adherence % over a 14-day window is noisy for accounts with 25-day cycles. A monthly window would smooth it but lose immediacy.</li>
      </ol>

      <h3>What this is good at</h3>
      <ul>
        <li>Identifies reps whose visit volume looks fine but whose visits aren't landing on cycle accounts (BV's story)</li>
        <li>Rewards consistency without prescribing rigid daily routes</li>
        <li>Self-calibrates per account so reps aren't penalised for accounts that genuinely don't need weekly visits</li>
      </ul>

      <h3>What this is NOT good at</h3>
      <ul>
        <li><strong>Not strategic.</strong> Treats all cycle accounts as equally important. R500k/month and R5k/month accounts both contribute equally.</li>
        <li><strong>Not predictive.</strong> Tells you which accounts are overdue today, not which were <em>worth</em> visiting.</li>
        <li><strong>Not robust to data quality.</strong> Hinges entirely on Related To being filled in correctly.</li>
      </ul>

      <h3>Open decisions</h3>
      <ol>
        <li>Is the 35-day cap right or should it be 28 days?</li>
        <li>Should the daily target weight accounts by revenue?</li>
        <li>Is "Related To" reliable enough as a join key?</li>
        <li>Two-week vs four-week measurement window for the scorecard?</li>
      </ol>
    `,
  },
  {
    section: "Decisions — Pending",
    title: "PULSE Plan Adherence — Volume vs Route Fidelity (needs proper fix)",
    summary: "The current plan adherence % in the PULSE scorecard measures raw visit count vs cycle daily target, not whether reps are visiting the right accounts. Capped at 100% for now. Needs a proper account-level fix.",
    tags: ["pulse", "scorecard", "adherence", "cycle", "decision"],
    updated: "2026-05-10",
    body: `
      <h3>What the current metric does</h3>
      <p>The PULSE bi-weekly scorecard shows a <strong>Plan%</strong> column per rep. It is calculated as:</p>
      <pre><code>plan_adherence = min(1.0, total_raw_visits / (cycle_daily_target × 10 working days))</code></pre>
      <p>The cap at 100% was added on 2026-05-10 to prevent confusing ">100% adherence" numbers when reps visit more accounts than their cycle rate requires.</p>

      <h3>Why this is wrong</h3>
      <p>The metric rewards <strong>visit volume</strong>, not <strong>route fidelity</strong>. A rep can hit 100% by visiting any accounts — walk-ins, prospects, non-cycle stores — while completely ignoring their established cycle route.</p>
      <p>Reps most affected:</p>
      <ul>
        <li><strong>AC (Aboo Cassim)</strong> — 35 visits in 10 days vs ~2/day cycle target → shows 100% but many visits are off-cycle</li>
        <li><strong>BM (Byron Minnie)</strong> — 65 visits in 10 days vs ~3/day cycle target → shows 100% but visit spread unclear</li>
      </ul>
      <p>The cycle heatmap tiles in the activity log already correctly show cycle-account-only adherence — but that number is not surfaced in the rep ranking table.</p>

      <h3>What the fix should be</h3>
      <p>Replace the current ratio with an account-level due/visited check:</p>
      <ol>
        <li>For each cycle account, check whether it was visited within the scorecard period <em>and</em> within its expected cycle window</li>
        <li>Plan adherence = accounts visited on schedule ÷ total cycle accounts due in the period</li>
        <li>This correctly flags a rep doing 50 walk-ins but missing 10 of their top 20 cycle accounts</li>
      </ol>
      <p>The cycle account and visit data are already in the system. The change is in <code>pulse_scorecard.py → build_scorecard_inputs()</code>, replacing the <code>rep_visits_actual / rep_visits_planned</code> ratio with an account-level due/visited calculation.</p>

      <h3>Questions to answer before fixing</h3>
      <ul>
        <li>Show both raw visit count and cycle adherence, or replace with cycle adherence only?</li>
        <li>Weight by account revenue (missing a R500k account = worse than missing a R5k account)?</li>
        <li>Should a rep visiting an account <em>ahead of</em> their cycle window still get credit?</li>
      </ul>
    `,
  },
];

// ── MANIFEST STATE ─────────────────────────────────────────────
// Declared here (before any renderer that references it) to avoid TDZ
// errors if a renderer is ever invoked before fetchManifest() runs.
const MANIFEST_STATE = {
  data: null,           // last-good manifest
  loadedAt: null,       // Date of last successful fetch
  error: null,          // last error message
  inFlight: false,
};

// ── TODAY KPI RENDERERS ────────────────────────────────────────
function renderTodayKpis(){
  const el = document.getElementById('today-kpis');
  const tasks = MANIFEST_STATE.data ? MANIFEST_STATE.data.tasks : [];

  let ok = 0, failed = 0, stale = 0;
  for (const t of tasks){
    const hb = t.last_run;
    if (t.heartbeat_status === 'stale') stale++;
    if (hb && hb.ok === true) ok++;
    if (hb && hb.ok === false) failed++;
  }

  const next = computeNextRunDelta(tasks);

  el.innerHTML = `
    <div class="kpi-card success">
      <div class="kpi-label">Jobs OK</div>
      <div class="kpi-number">${tasks.length ? ok : '—'}</div>
    </div>
    <div class="kpi-card ${failed ? 'danger' : ''}">
      <div class="kpi-label">Jobs Failed</div>
      <div class="kpi-number">${tasks.length ? failed : '—'}</div>
    </div>
    <div class="kpi-card ${stale ? 'warning' : ''}">
      <div class="kpi-label">Stale</div>
      <div class="kpi-number">${tasks.length ? stale : '—'}</div>
    </div>
    <div class="kpi-card kpi-empty">
      <div class="kpi-label">Next run in</div>
      <div class="kpi-number">${next || '—'}</div>
    </div>
  `;
}

function computeNextRunDelta(tasks){
  if (!tasks || !tasks.length) return null;
  const now = Date.now();
  let earliest = null;
  for (const t of tasks){
    if (!t.next_run) continue;
    const ts = Date.parse(t.next_run.replace(' ', 'T'));
    if (isNaN(ts) || ts <= now) continue;
    if (earliest === null || ts < earliest) earliest = ts;
  }
  if (earliest === null) return null;
  return humanizeDelta(earliest - now);
}

function humanizeDelta(ms){
  if (ms < 0) return 'now';
  const s = Math.round(ms / 1000);
  if (s < 60) return `${s}s`;
  const m = Math.round(s / 60);
  if (m < 60) return `${m}m`;
  const h = Math.floor(m / 60);
  const rem = m % 60;
  if (h < 24) return rem ? `${h}h${rem}m` : `${h}h`;
  const d = Math.floor(h / 24);
  return `${d}d`;
}

function renderTodayIssues(){
  const wrap = document.getElementById('today-issues');
  const tasks = MANIFEST_STATE.data ? MANIFEST_STATE.data.tasks : [];
  const issues = [];
  for (const t of tasks){
    if (t.last_run && t.last_run.ok === false){
      issues.push({ task: t, kind: 'failed', text: 'Last run failed' });

  wrap.hidden = false;
  wrap.innerHTML = `
    <h2>${issues.length} issue${issues.length === 1 ? '' : 's'} need attention</h2>
    <ul>
      ${issues.map(i => `
        <li onclick="jumpToScheduleTask('${escapeAttr(i.task.job_id)}')">
          <span><strong>${escapeHtml(i.task.name)}</strong> <span class="issue-meta">· ${escapeHtml(i.task.agent)}</span></span>
          <span class="issue-meta">${escapeHtml(i.text)}</span>
        </li>
      `).join('')}
    </ul>
  `;
}

function renderInsights(){

  if (!INFO_INSIGHT_DATA.length){
    wrap.innerHTML = `<h2>Information Insights</h2><div class="insights-empty">No insights yet. Add one via the "add to information insight" workflow.</div>`;

function escapeHtml(s){
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function escapeAttr(s){ return escapeHtml(s); }

// ── SCHEDULE SECTION (Tasks 9 + 10) ───────────────────────────
const FILTER_STATE = {
  group: 'all',        // 'all' | 'failing' | 'today'
  agents: new Set(),   // empty = no agent filter
};

function renderScheduleChips(){
  const el = document.getElementById('schedule-chips');
  if (!el) return;
  const agents = Array.from(new Set((MANIFEST_STATE.data?.tasks || []).map(t => t.agent))).sort();
  const chips = [
    `<button class="chip ${FILTER_STATE.group === 'all' ? 'active' : ''}" onclick="setFilterGroup('all')">All</button>`,
    `<button class="chip ${FILTER_STATE.group === 'failing' ? 'active' : ''}" onclick="setFilterGroup('failing')">Failing</button>`,
    `<button class="chip ${FILTER_STATE.group === 'today' ? 'active' : ''}" onclick="setFilterGroup('today')">Today</button>`,
  ];
  for (const a of agents){
    chips.push(`<button class="chip ${FILTER_STATE.agents.has(a) ? 'active' : ''}" onclick="toggleAgentFilter('${escapeAttr(a)}')">${escapeHtml(a)}</button>`);
  }
  el.innerHTML = chips.join('');
}

function setFilterGroup(group){
  FILTER_STATE.group = group;
  renderScheduleChips();
  renderScheduleGroups();
}

function toggleAgentFilter(agent){
  if (FILTER_STATE.agents.has(agent)) FILTER_STATE.agents.delete(agent);
  else FILTER_STATE.agents.add(agent);
  renderScheduleChips();
  renderScheduleGroups();
}

function filteredTasks(){
  const tasks = MANIFEST_STATE.data?.tasks || [];
  return tasks.filter(t => {
    if (FILTER_STATE.group === 'failing'){
      if (!(t.heartbeat_status === 'stale' || (t.last_run && t.last_run.ok === false))) return false;
    }
    if (FILTER_STATE.group === 'today'){
      const next = t.next_run ? Date.parse(t.next_run.replace(' ', 'T')) : NaN;
      const todayEnd = new Date(); todayEnd.setHours(23,59,59,999);
      if (!(next && next <= todayEnd.getTime())) return false;
    }
    if (FILTER_STATE.agents.size && !FILTER_STATE.agents.has(t.agent)) return false;
    return true;
  });
}

function renderScheduleGroups(){
  const wrap = document.getElementById('agent-groups');
  if (!wrap) return;
  const tasks = filteredTasks();
  if (!tasks.length){
    wrap.innerHTML = `<p class="section-placeholder">No tasks match the current filters.</p>`;
    return;
  }
  const byAgent = {};
  for (const t of tasks){
    if (!byAgent[t.agent]) byAgent[t.agent] = [];
    byAgent[t.agent].push(t);
  }
  const agentNames = Object.keys(byAgent).sort();
  wrap.innerHTML = agentNames.map(agent => renderAgentGroup(agent, byAgent[agent])).join('');
}

function renderAgentGroup(agent, tasks){
  const counts = tasks.reduce((acc, t) => {
    if (t.heartbeat_status === 'fresh') acc.fresh++;
    else if (t.heartbeat_status === 'stale') acc.stale++;
    if (t.last_run && t.last_run.ok === false) acc.failed++;
    return acc;
  }, { fresh: 0, stale: 0, failed: 0 });
  return `
    <div class="agent-group open" id="group-${escapeAttr(agent)}">
      <div class="agent-group-header" onclick="toggleGroup('${escapeAttr(agent)}')">
        <h3><span class="agent-group-caret">&#9658;</span>${escapeHtml(agent)}</h3>
        <div class="agent-group-summary">${tasks.length} jobs &middot; ${counts.fresh} fresh &middot; ${counts.stale} stale &middot; ${counts.failed} failed</div>
      </div>
      <div class="agent-tasks">
        ${tasks.map(renderTaskRow).join('')}
      </div>
    </div>
  `;
}

function toggleGroup(agent){
  document.getElementById('group-' + agent)?.classList.toggle('open');
}

function humanizeAgo(isoStr, future){
  if (!isoStr) return '&#8212;';
  const ts = Date.parse(isoStr.replace(' ', 'T'));
  if (isNaN(ts)) return '&#8212;';
  const diff = future ? ts - Date.now() : Date.now() - ts;
  if (diff < 0) return future ? 'now' : 'in future';
  return (future ? 'in ' : '') + humanizeDelta(diff) + (future ? '' : ' ago');
}

function renderTaskRow(t){
  const last = t.last_run ? humanizeAgo(t.last_run.finished_at) : '&#8212;';
  const next = t.next_run ? humanizeAgo(t.next_run, true) : '&#8212;';
  const status = t.last_run && t.last_run.ok === false ? 'failed' : (t.heartbeat_status || 'never_run');
  return `
    <div class="task-row" data-job-id="${escapeAttr(t.job_id)}" onclick="toggleTaskExpand('${escapeAttr(t.job_id)}', this)">
      <span class="task-name">${escapeHtml(t.name)}</span>
      <span class="status-badge ${status}">${escapeHtml(status)}</span>
      <span class="task-meta last-run">last ${last}</span>
      <span class="task-meta next-run">next ${next}</span>
    </div>
    <div class="task-detail" id="detail-${escapeAttr(t.job_id)}">
      ${renderTaskDetail(t)}
    </div>
  `;
}

function renderTaskDetail(t){

  const hist = (t.history || []).slice(-5).reverse();

  return `
    <h4>Details</h4>
    <dl class="kv">
      <dt>Schedule</dt><dd>${escapeHtml(t.schedule_summary || '&#8212;')}</dd>
      <dt>Next run</dt><dd>${escapeHtml(t.next_run || '&#8212;')}</dd>
      <dt>Last run</dt><dd>${escapeHtml(last.finished_at || '&#8212;')} (${last.duration_seconds != null ? last.duration_seconds + 's' : '&#8212;'})</dd>
      <dt>Exit code</dt><dd>${last.exit_code != null ? last.exit_code : '&#8212;'}</dd>
      <dt>Summary</dt><dd>${summary}</dd>
      <dt>Log path</dt><dd>${escapeHtml(last.log_path || '&#8212;')}<button class="copy-btn" onclick="event.stopPropagation();copyText('${escapeAttr(last.log_path || '')}')">copy</button></dd>
    </dl>
    <h4>History (last 5 runs)</h4>
    <div class="history">
      <span class="h-head">Started</span>
      <span class="h-head">Dur</span>
      <span class="h-head">Exit</span>
      <span class="h-head">OK</span>
      ${hist.length ? hist.map(h => `
        <span>${escapeHtml((h.started_at || '').replace('T',' ').slice(0,19))}</span>
        <span>${escapeHtml(String(h.duration_seconds != null ? h.duration_seconds + 's' : '&#8212;'))}</span>
        <span>${escapeHtml(String(h.exit_code != null ? h.exit_code : '&#8212;'))}</span>
        <span class="${h.ok ? 'ok-yes' : 'ok-no'}">${h.ok ? '&#10003;' : '&#10007;'}</span>
      `).join('') : `<span style="grid-column:1/-1;color:var(--color-text-tertiary);font-style:italic">no history yet</span>`}
    </div>

}

async function fetchManifest(){
  if (MANIFEST_STATE.inFlight) return;
  MANIFEST_STATE.inFlight = true;
  setRefreshSpinning(true);
  try {
    const res = await fetch('data/schedule_manifest.json', { cache: 'no-cache' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const json = await res.json();
    if (!json || !Array.isArray(json.tasks)) throw new Error('malformed manifest');
    MANIFEST_STATE.data = json;
    MANIFEST_STATE.loadedAt = new Date();
    MANIFEST_STATE.error = null;
  } catch (err) {
    MANIFEST_STATE.error = err.message || String(err);
    console.warn('fetchManifest failed:', MANIFEST_STATE.error);
  } finally {
    MANIFEST_STATE.inFlight = false;
    setRefreshSpinning(false);
    renderFreshness();
    renderAll();
  }
}

function renderFreshness(){
  const bar = document.getElementById('freshness-bar');
  const text = document.getElementById('freshness-text');
  if (MANIFEST_STATE.error && MANIFEST_STATE.data) {
    bar.classList.add('error');
    text.textContent = `Refresh failed (${MANIFEST_STATE.error}) — showing data from ${formatTimestamp(MANIFEST_STATE.loadedAt)}`;
  } else if (MANIFEST_STATE.error) {
    bar.classList.add('error');
    text.textContent = `Manifest unreachable: ${MANIFEST_STATE.error}`;
  } else if (MANIFEST_STATE.data) {
    bar.classList.remove('error');
    const generated = MANIFEST_STATE.data.generated_at || 'unknown';
    text.textContent = `Manifest generated ${generated} · loaded ${formatTimestamp(MANIFEST_STATE.loadedAt)}`;
  } else {
    bar.classList.remove('error');
    text.textContent = 'Loading manifest...';
  }
}

function formatTimestamp(d){
  if (!d) return '—';
  const pad = n => String(n).padStart(2, '0');
  return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}

function setRefreshSpinning(on){
  const btn = document.getElementById('refresh-btn');
  if (btn) btn.classList.toggle('spinning', !!on);
}

// ── DASHBOARDS SECTION (Task 11) ──────────────────────────────
const DASH_FILTER = { agents: new Set() };

function renderDashboardsChips(){
  const el = document.getElementById('dashboards-chips');
  if (!el) return;
  const agents = Array.from(new Set(DASHBOARDS.map(d => d.agent))).sort();
  el.innerHTML = [
    `<button class="chip ${DASH_FILTER.agents.size === 0 ? 'active' : ''}" onclick="clearDashFilter()">All</button>`,
    ...agents.map(a => `<button class="chip ${DASH_FILTER.agents.has(a) ? 'active' : ''}" onclick="toggleDashFilter('${escapeAttr(a)}')">${escapeHtml(a)}</button>`)
  ].join('');
}

function clearDashFilter(){ DASH_FILTER.agents.clear(); renderDashboardsChips(); renderDashboardsGrid(); }
function toggleDashFilter(a){
  if (DASH_FILTER.agents.has(a)) DASH_FILTER.agents.delete(a);
  else DASH_FILTER.agents.add(a);
  renderDashboardsChips(); renderDashboardsGrid();
}

function renderDashboardsGrid(){
  const el = document.getElementById('dashboards-grid');
  if (!el) return;
  const list = DASH_FILTER.agents.size
    ? DASHBOARDS.filter(d => DASH_FILTER.agents.has(d.agent))
    : DASHBOARDS;
  if (!list.length){ el.innerHTML = `<p class="section-placeholder">No dashboards match.</p>`; return; }
  el.innerHTML = list.map(d => `
    <div class="dash-card">
      <span class="agent-pill">${escapeHtml(d.agent)}</span>
      <h3>${escapeHtml(d.title)}</h3>
      <p class="desc">${escapeHtml(d.desc || '')}</p>
      <a class="open-link" href="${escapeAttr(d.url)}" target="_blank" rel="noopener">Open &#8599;</a>
    </div>
  `).join('');
}

// ── REPORTS SECTION (Task 12) ──────────────────────────────────
function renderReports(){
  const el = document.getElementById('reports-list');
  if (!el) return;
  if (!REPORTS.length){ el.innerHTML = `<p class="section-placeholder" style="padding:16px">No reports configured.</p>`; return; }
  el.innerHTML = REPORTS.map(r => {
    const task = MANIFEST_STATE.data?.tasks?.find(t => t.job_id === r.job_id);
    const lastRun = task?.last_run?.finished_at;
    const lastStr = lastRun ? humanizeAgo(lastRun) : 'never';
    return `
      <div class="report-row">
        <span class="r-title">${escapeHtml(r.title)}</span>
        <span class="r-meta">${escapeHtml(r.agent)} &middot; ${escapeHtml(r.cadence)}</span>
        <span class="r-last">Last: ${lastStr}</span>
        <button class="r-open" onclick="jumpToScheduleTask('${escapeAttr(r.job_id)}')">View</button>
      </div>
    `;
  }).join('');
}

// ── AGENTS SECTION (Task 13) ──────────────────────────────────
function renderAgents(){
  const el = document.getElementById('agents-grid');
  if (!el) return;
  const tasksByJobId = {};
  (MANIFEST_STATE.data?.tasks || []).forEach(t => { tasksByJobId[t.job_id] = t; });

  el.innerHTML = AGENTS.map(a => {
    const ownedTasks = a.task_ids.map(id => tasksByJobId[id]).filter(Boolean);
    const ownedDashboards = DASHBOARDS.filter(d => d.agent === a.id);
    const ownedReports = REPORTS.filter(r => r.agent === a.id);
    return `
      <div class="agent-card" onclick="toggleAgentCard(this)">
        <h3>${escapeHtml(a.name)}</h3>
        <p class="tagline">${escapeHtml(a.tagline)}</p>
        <span class="slash">${escapeHtml(a.slash)}</span>
        <div class="counts">${ownedTasks.length} task${ownedTasks.length === 1 ? '' : 's'} &middot; ${ownedDashboards.length} dashboard${ownedDashboards.length === 1 ? '' : 's'} &middot; ${ownedReports.length} report${ownedReports.length === 1 ? '' : 's'}</div>
        <div class="owned-list">
          <div class="owned-section">
            <h4>Scheduled tasks</h4>
            <ul>${ownedTasks.length
              ? ownedTasks.map(t => `<li>${escapeHtml(t.name)}</li>`).join('')
              : '<li class="empty">none</li>'}</ul>
          </div>
          <div class="owned-section">
            <h4>Dashboards</h4>
            <ul>${ownedDashboards.length
              ? ownedDashboards.map(d => `<li>${escapeHtml(d.title)}</li>`).join('')
              : '<li class="empty">none</li>'}</ul>
          </div>
          <div class="owned-section">
            <h4>Reports</h4>
            <ul>${ownedReports.length
              ? ownedReports.map(r => `<li>${escapeHtml(r.title)}</li>`).join('')
              : '<li class="empty">none</li>'}</ul>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

function toggleAgentCard(card){
  card.classList.toggle('expanded');
}

    <div class="manual-card">
      <span class="agent-pill">${escapeHtml(a.agent)}</span>

      <p class="desc">${escapeHtml(a.desc)}</p>

        <div><b>Output</b>${escapeHtml(a.output)}</div>
      </div>
      <div class="prompt-box" id="prompt-${a.id}">${escapeHtml(a.prompt)}</div>
      <button class="copy-btn" data-id="${a.id}" onclick="copyManualPrompt('${a.id}', this)">Copy prompt</button>
    </div>
  `).join('');
}

function copyManualPrompt(id, btn){
  const action = MANUAL_ACTIONS.find(a => a.id === id);
  if (!action) return;
  const text = action.prompt;
  const done = () => {
    const original = btn.textContent;
    btn.textContent = 'Copied ✓';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = original; btn.classList.remove('copied'); }, 1800);
  };
  // navigator.clipboard requires a secure context — fall back to textarea.
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}

function fallbackCopy(text, done){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); done(); }
  catch (e) { alert('Copy failed — select the text manually.'); }
  finally { document.body.removeChild(ta); }
}
